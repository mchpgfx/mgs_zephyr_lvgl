<text x="32" y="584" fill="#48536b" font-size="13">FPS is capped by LVGL's refresh period (~30 FPS / 33 ms): lighter scenes sit at that ceiling, so the CPU-vs-GPU difference in render time is wider than the FPS lines suggest.</text>
<text x="32" y="603" fill="#48536b" font-size="13">CPU numbers are without NEON SIMD (not yet supported in Zephyr); the Linux port uses NEON for software rendering and would be faster still.</text>
