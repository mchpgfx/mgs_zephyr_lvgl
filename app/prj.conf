# Enable Logging (deferred mode — immediate blocks the render thread)
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_DISPLAY_LOG_LEVEL_INF=y

# Enable Display Subsystem
CONFIG_DISPLAY=y

# Enable XLCDC driver
CONFIG_DISPLAY_MICROCHIP_SAM_XLCDC=y
CONFIG_DISPLAY_MICROCHIP_SAM_XLCDC_LAYER=y

# Enable LVDSC bridge driver
CONFIG_DISPLAY_MICROCHIP_SAM_LVDSC=y

# Kernel VM must cover heap (16MB) + kernel code/data/stacks
CONFIG_KERNEL_VM_SIZE=0x2000000

# Stacks: LVGL rendering plus the nano2D GPU library's deep call chains / large
# frames. main() and POST_KERNEL device init (n2d_init/n2d_open) run on the main
# stack; the GPU ISR -> n2d_handle_events runs on the ISR stack. Sentinel turns
# any future overflow into a clean fatal.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y

# Keep MICROCHIP_SAM_XLCDC_DOUBLE_BUFFER OFF — LVGL owns the two VDBs (zero-copy).
# CONFIG_MICROCHIP_SAM_XLCDC_DOUBLE_BUFFER=y

# Heap for base-layer framebuffer + GC520UL GPU heap + slack
CONFIG_HEAP_MEM_POOL_SIZE=4194304

# GC520UL 2D GPU (nano2D library linked as a prebuilt static lib)
CONFIG_GPU_MICROCHIP_GC520UL=y

# Non-cached MMU region for the nano2D GPU heap. The GPU DMAs its command buffers
# straight out of this heap, so mapping the region non-cached keeps CPU writes
# coherent with the GPU without any per-allocation cache maintenance. Backs the
# __nocache gpu_heap in microchip_gc520ul.c — see there for the full rationale.
CONFIG_NOCACHE_MEMORY=y

# FLEXCOM MFD (sets FLEX_MR to TWI/SPI/USART mode)
CONFIG_MFD=y

# Panel power regulator (PB18 enable before touch init)
CONFIG_REGULATOR=y

# Input / Touch
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# LVGL (zero-copy: LVGL owns buffers, driver pointer-swaps DMA address)
CONFIG_LVGL=y
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_MEM_POOL_SIZE=524288
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_DPI_DEF=128
# The GC520 needs its dest/source surface base cache-line aligned; align LVGL's
# draw buffers (incl. the VDBs the GPU renders into) to 64 bytes. Default 4
# leaves the VDB base misaligned -> GPU writes stray edge columns.
CONFIG_LV_DRAW_BUF_ALIGN=64
# Align LVGL's static image arrays (the const C-array assets the GPU blits as
# source surfaces) to 64 bytes too. Zephyr's lv_conf.h maps LV_ATTRIBUTE_MEM_ALIGN
# to __aligned(this); the default 1 leaves image bases 4-byte aligned, which the
# GC520 source fetch mis-reads (torn/sheared blit). The draw unit's alignment
# guard pushes any still-unaligned source to the SW renderer.
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=64
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_26=y
CONFIG_LV_FONT_MONTSERRAT_28=y

# LVGL Benchmark Demo (requires widgets demo)
CONFIG_LV_BUILD_DEMOS=y
CONFIG_LV_USE_DEMO_BENCHMARK=y
CONFIG_LV_USE_DEMO_WIDGETS=y
CONFIG_LV_DRAW_LAYER_SIMPLE_BUF_SIZE=76800
CONFIG_LV_USE_SYSMON=y
CONFIG_LV_USE_PERF_MONITOR=y

# Route LVGL's LV_LOG() through printf so the benchmark's per-scene and
# "All scenes avg." FPS/CPU CSV summary is emitted on the console UART (the
# on-screen summary table needs LV_USE_LOG too). USER level keeps it to the
# benchmark's own output without trace/info spam.
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_USER=y
CONFIG_LV_LOG_PRINTF=y
